[package]
name = "ds-chat"
version = "0.1.4"
description = "DeepSeek chat client for Windows and Android"
authors = ["SiriLee"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Desktop 使用 rlib，Android 需要 staticlib 与 cdylib
name = "ds_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
